# Orbit configuration (no secrets here - secrets live in .env)

providers:
  openai:
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
  # Any OpenAI-compatible endpoint works the same way, e.g.:
  # deepseek:
  #   base_url: https://api.deepseek.com/v1
  #   api_key_env: DEEPSEEK_API_KEY
  # ollama:
  #   base_url: http://127.0.0.1:11434/v1
  #   api_key_env: OLLAMA_API_KEY   # any non-empty value

# Code only ever asks for a *task*; this table decides which model serves it.
tasks:
  chat:      { provider: openai, model: gpt-5 }
  fast:      { provider: openai, model: gpt-5-mini }
  summarize: { provider: openai, model: gpt-5-mini }
  code:      { provider: openai, model: gpt-5 }
  briefing:  { provider: openai, model: gpt-5 }
  # Vectors are stored as vector(1536): changing this model or its dimension
  # needs a new Alembic migration and a re-embed of every posting and profile.
  embed:     { provider: openai, model: text-embedding-3-small }
  # Radar posting extraction (M4.2): schema-constrained JSON from a small model. Low reasoning
  # effort keeps it cheap; raise it if `orbit radar eval` accuracy is poor.
  extract:   { provider: openai, model: gpt-5-mini, params: { reasoning_effort: low } }
  # Extra request params are passed straight to the API, e.g.
  # chat: { provider: openai, model: gpt-5, params: { reasoning_effort: low } }

agent:
  name: Orbit
  history_turns: 20        # recent messages kept in context per session
  max_tool_rounds: 8       # tool-call loop guard

api:
  host: 127.0.0.1
  port: 8765

telegram:
  enabled: true            # set false to run CLI-only

jobs:
  briefing:
    enabled: true
    cron: "0 8 * * *"      # every day 08:00 local time
  startup_notice: true     # push "Orbit online" to Telegram on start

# Polled in-process by APScheduler. Optional keys per watcher: interval_minutes (default 5) and
# first_run_delay_seconds (first check that long after startup instead of one full interval later).
watchers:
  - { type: internship_radar, interval_minutes: 30, first_run_delay_seconds: 60 }

# Internship Radar preferences (used by the internship_radar watcher and `orbit radar ...`).
radar:
  # Work terms you want, as "<Season> <YYYY>". Add "Winter 2027" if your next co-op term is in winter.
  terms: ["Summer 2027", "Fall 2027"]
  # A posting passes when an extracted location is listed here, or it is remote and open to Canada.
  # Formats: "City, XX" (two-letter province/state) or "Remote (Canada)".
  locations: ["Toronto, ON", "Waterloo, ON", "Kitchener, ON", "Remote (Canada)"]
  notify_threshold: 0.45           # cosine similarity to the resume; placeholder until calibrated (M5.5)
  resume_path: data/resume.md      # relative to ORBIT_HOME; data/ is git-ignored
  max_extract_per_poll: 40         # caps LLM extraction cost per 30-minute poll
  max_notifications_per_poll: 5    # extra matches go into one digest message
