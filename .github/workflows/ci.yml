name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint, migrate, test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: orbit
          POSTGRES_PASSWORD: orbit
          POSTGRES_DB: orbit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orbit -d orbit_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # The service's dedicated test DB. The migration creates the vector extension itself.
      DATABASE_URL: postgresql+asyncpg://orbit:orbit@localhost:5432/orbit_test
      TEST_DATABASE_URL: postgresql+asyncpg://orbit:orbit@localhost:5432/orbit_test
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Migrate a clean database (alembic upgrade head)
        run: alembic upgrade head

      - name: Test (pytest)
        run: pytest

      - name: Validate docker-compose.yml
        run: docker compose config -q
