    To be considered for an internship/co-op, please add your most up to date academic transcripts alongside with your resume for further review.

    The US hourly range for this role is: $40- $55 USD and the Canada hourly range for this role is: $45-$60 CAD in addition to competitive perks & benefits. Waabi US Inc. and Waabi Canada Inc.'s yearly salary ranges are determined based on several factors in accordance with the Company’s compensation practices. The salary base range is reflective of the minimum and maximum target for new hire salaries for the position across all US and Canada locations.

