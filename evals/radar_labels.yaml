# Internship Radar extraction eval set (M4.5). Format: see the docstring of orbit/radar/eval.py.
#
# STATUS: checked. The 30 `expected` blocks below were drafted by a coding agent that read each
# posting's description_text by hand (never from the extraction model's output), then checked against
# the source text by Claude. The labeling rules below were approved by Xinyang Qiao on 2026-10-21.
#
# Approved labeling rules (on top of the field definitions in step 2 below):
#   - A posting that calls itself an internship (or co-op) counts as is_internship true, even if it is
#     also open to graduates or high-school students.
#   - A year-only or season-only term ("2027", "this summer") stays empty: terms = [].
#   - A separately listed remote location makes remote_ok true, unless the role's own text (or its
#     listing tag, such as "(Hybrid)") says hybrid.
#   - A term that spills a few days into the next season does not count that season.
#
# How to review (about 1-2 minutes per item):
#   1. Read the item's title, location_raw and description_text. Label only from that snapshot: it is
#      what the model sees (the live posting may have changed, and the snapshot may be truncated).
#   2. Check each of the seven expected fields against the field definitions in
#      orbit/radar/models.py (PostingExtraction) and the rules in orbit/radar/extract.py:
#        - is_internship: internship, co-op or student program (PEY, student research). New-grad,
#          early-career, full-time, part-time and contract roles are false.
#        - terms: "<Season> <YYYY>" with Winter = Jan-Apr, Summer = May-Aug ("Spring" means Summer),
#          Fall = Sep-Dec; one entry per term; [] when no term or dates are stated. Graduation dates and
#          full-time start dates are not terms.
#        - locations: every place the role can be done, in canonical form ("Toronto, ON",
#          "Seattle, WA", "Remote (Canada)", "Remote (US)"); a remote listing that names Canada becomes
#          "Remote (Canada)".
#        - remote_ok / canada_eligible: booleans as defined in PostingExtraction.
#        - role_type: one of swe, ml_ai, data, infra, security, mobile, frontend, hardware, product,
#          design, research, other.
#        - tech_stack: concrete technologies only (languages, frameworks, libraries, databases, clouds,
#          tools), lowercase; no concepts such as "machine learning" or "distributed systems".
#   3. `label_notes` marks the ambiguous calls (look for AMBIGUOUS, HARD CASE, VAGUE TERM, NEW GRAD).
#      Fix any label you disagree with and update or delete its note.
#   4. Only after ALL 30 items are reviewed, change `status` to something like
#      "verified by <name> on <date>". Never flip it after a partial review.
#   5. Check the file still loads: `orbit radar eval --dry-run` (or load_labels in Python).
#
# Sources: 30 live postings polled from the seeded public Greenhouse, Lever and Ashby boards in
# October 2026; description_text is the stored plain text cut to at most 6000 characters.

status: "labels checked against source by Claude; labeling rules approved by Xinyang Qiao, 2026-10-21"
version: 1
notes: 'Labels for the extraction eval (M4.5): 30 real postings, drafted by reading each snapshot and checked
  against the source text; labeling rules in the header comment.'
