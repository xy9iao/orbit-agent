# Internship Radar seed companies: loaded by `orbit radar seed`, checked live by `orbit radar verify-sources`.
#
# Every board token below returned HTTP 200 from its public job-board API when probed on 2026-10-15
# (one GET per candidate, >= 1 s apart per host). Tokens that 404'd were left out rather than guessed.
# Only the three public, no-login APIs are allowed (CLAUDE.md): greenhouse, lever, ashby.
#
# Fields: slug (unique, lowercase), name, source, board_token (Lever EU boards are written `eu:<site>`),
# hq_city. For companies headquartered outside Canada, hq_city is the city of their Canadian engineering
# office, since that is where the radar looks; the comment on each line says which case applies.
# Optional `active: false|true` overrides the DB flag; leave it out to keep whatever the DB says.

companies:
  # ---- Greenhouse (boards-api.greenhouse.io) ----
  - {slug: d2l, name: D2L, source: greenhouse, board_token: d2l, hq_city: Kitchener}  # HQ Kitchener
