[project]
name = "orbit"
version = "0.1.0"
description = "Orbit - an always-on personal AI agent (Telegram + CLI, OpenAI-compatible model router, proactive reminders and briefings)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.50",
    "anthropic>=1.15",
    "httpx>=0.27",
    "python-telegram-bot>=21.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "apscheduler>=3.10,<4",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pgvector>=0.3",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "typer>=0.12",
    "loguru>=0.7",
    "tzlocal>=5.0",
    "jsonschema>=4.21",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.6", "python-dotenv>=1.0"]

[project.scripts]
orbit = "orbit.cli.main:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["orbit*"]

# migrations/ has no __init__.py, so a non-editable install (Docker) needs it listed to ship the Alembic scripts.
[tool.setuptools.package-data]
"orbit.storage" = ["migrations/*.py", "migrations/*.mako", "migrations/versions/*.py"]
"orbit.radar" = ["seeds.yaml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.isort]
combine-as-imports = true
