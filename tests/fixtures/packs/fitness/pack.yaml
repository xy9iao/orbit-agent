name: fitness
description: Test fixture. Training plan and workout log.
schema_version: 1
collections:
  workouts:
    type: object
    required: [day_type, exercise, sets]
    properties:
      day_type:
        type: string
        enum: [back_a, shoulder_a, legs, chest, back_b, shoulder_b_arms, other]
      exercise: {type: string}
      sets:
        type: array
        minItems: 1
        items:
          type: object
          required: [weight, unit, reps]
          properties:
            weight: {type: number}
            unit: {type: string, enum: [lb, kg]}
            reps: {type: integer}
            rir: {type: integer}
            assist: {type: boolean}
      pain: {type: integer, minimum: 0, maximum: 10}
      energy: {type: integer, minimum: 1, maximum: 5}
      notes: {type: string}
routines:
  - id: morning_plan
    cron: "30 7 * * *"
    prompt: Plan today's session from the cycle and the last workouts.
  - id: cycle_summary
    cron: "0 21 * * *"
    prompt: Summarize the cycle only on the day it ends; otherwise send nothing.
locked_sections: [目标, 训练循环, 不能做]
