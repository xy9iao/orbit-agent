name: study
description: Test fixture. Study blocks and lecture status.
schema_version: 1
collections:
  study_blocks:
    type: object
    required: [date, blocks]
    properties:
      date: {type: string, format: date}
      blocks: {type: number, minimum: 0}
      target: {type: number, minimum: 0}
      courses: {type: array, items: {type: string}}
      kinds:
        type: array
        items: {type: string, enum: [preview, catchup, assignment, exam_prep, other]}
      place: {type: string}
      energy: {type: integer, minimum: 1, maximum: 5}
      notes: {type: string}
  lectures:
    type: object
    required: [course, lecture, status]
    properties:
      course: {type: string}
      lecture: {type: string}
      topic: {type: string}
      status:
        type: string
        enum: [missed, not_understood, previewed, understood, ask_ta]
      revisit: {type: string}
      notes: {type: string}
routines:
  - id: preview_reminder
    cron: "0 19 * * 1,3"
    prompt: List the lectures to catch up on and remind to preview tomorrow's.
  - id: weekly_review
    cron: "0 20 * * 0"
    prompt: Summarize this week's study blocks and open lectures.
locked_sections: [目标, 每周节奏, 不做]
